# KaushalForge config — copy to config.yaml and fill. (YAML; comments start with #)

person:
  name: "Your Full Name"
  pronouns: "He/Him"
  location_display: "City, Country | Open to relocation"   # shown on résumés/letters; keep neutral

contact:
  # Leave any field blank ("") to OMIT it — KaushalForge never renders a placeholder/dummy
  # value (better to show nothing than a fake). Unset fields are reported when you render.
  # Tip: github + portfolio often overlap (a *.github.io page links to GitHub) — keep
  # whichever you prefer and blank the other to keep the contact line short.
  email: "your.email@example.com"     # personal, not employer
  phone: "+CC-XXXXXXXXXX"
  linkedin: "linkedin.com/in/yourhandle"   # no https:// (scripts add it)
  github: "github.com/yourhandle"
  portfolio: "yourhandle.github.io"        # optional; omit if none

targets:
  geos: ["US", "Canada", "Australia", "NZ"]
  diplomatic: true        # true => NOTHING public implies job-seeking (LinkedIn stays curiosity/impact framed)

resume:
  accent_hex: "1F4E79"    # heading/name colour for modern+twocol+letter styles (ATS style stays black)
  two_page: "all"         # "all" => every role variant also gets a 2-page edition; or a list like ["05","06","07"]
  cap_overrides:          # current-role bullet cap for dense (long-bullet) variants on the 1-pager
    "05": 3
  fill:                   # page-2 fill target for 2-page editions; verify.py warns (non-blocking)
    target_min: 0.40      # warn when page 2 is < 40% full — consider the 1-page edition or add depth
    target_max: 0.70      # a 40-70% page 2 reads as intentional (advisory only; never blocks a build)

verify:
  # Masking map: sensitive term -> public-safe replacement. KEYS (internal codenames, client
  # names, manager/peer names) are leak-scanned by engine/verify.py AND the pre-commit hook —
  # they must never reach generated outputs OR any tracked file. VALUES say how to generalise.
  # This is the single source of truth; add a term once and every gate uses it.
  mask:
    # "project-zeus": "an internal service"
    # "BigBoxCo": "a Fortune-500 retailer"
  # Legacy flat list is still honoured if you prefer it:
  # forbidden_terms: ["codename-a", "ClientB"]
